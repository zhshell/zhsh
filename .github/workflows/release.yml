name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public repository boundary
        run: scripts/check-public-boundary.sh

      - name: Import release verification key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEY: ${{ vars.ZHSH_RELEASE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          test -n "$RELEASE_KEY"
          printf '%s' "$RELEASE_KEY" | base64 --decode | gpg --batch --import

      - name: Run release gate
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            make release-check-tag
          else
            make release-check
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: zhsh-${{ github.sha }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: zhsh-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "zhsh $GITHUB_REF_NAME prototype" \
            --notes-file dist/RELEASE_NOTES.md
