# cargo-deny 0.19.0；任何例外必须同时记录原因、负责人和失效日期。

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = []

# Cargo copies the Workspace root license into each source package as `LICENSE` only when the
# member declares `license-file`. cargo-deny does not treat that field as an SPDX declaration,
# so pin the shared GPL-3.0 text by content hash instead of suppressing the diagnostic.
[[licenses.clarify]]
crate = "zhsh"
expression = "GPL-3.0-or-later"
license-files = [
    { path = "../LICENSE", hash = 0xc5a651aa },
]

[bans]
# 正常 build/runtime 重复边不直接阻断；完整报告由 release-check 保存。
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
